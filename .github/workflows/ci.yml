name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install tree-sitter CLI
        # A plain `npm install` would run this package's `node-gyp-build`
        # install script (Node binding build) — unnecessary for CI and
        # broken on runners with Visual Studio versions old node-gyp
        # cannot detect. The CLI is all these jobs need.
        run: npm install -g tree-sitter-cli@0.24.7
      # The committed src/parser.c is the artifact under test — generation
      # takes ~70 CPU-minutes on this grammar (STATE_COUNT ~24k), so it is
      # done locally when grammar.js changes and committed. The corpus and
      # sweep below fail if the committed parser misbehaves.
      - name: Run corpus tests
        run: tree-sitter test
      - name: Parse sweep (recursive, baseline-aware)
        run: sh scripts/parse-sweep.sh
