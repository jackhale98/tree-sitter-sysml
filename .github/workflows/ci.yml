name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Generate parser
        run: npx tree-sitter generate
      - name: Run corpus tests
        run: npx tree-sitter test
      - name: Parse official examples
        run: |
          for f in test/examples/*.sysml; do
            echo "Parsing $f..."
            npx tree-sitter parse "$f" > /dev/null
          done
